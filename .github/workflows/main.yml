name: Auto-Update MMDB

# Wake up every Sunday at midnight, or let me trigger it manually
on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  update-database:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Download GeoLite2 ASN Database
        run: |
          wget -O database.tar.gz "https://download.maxmind.com/app/geoip_download?edition_id=GeoLite2-ASN&license_key=${{ secrets.MAXMIND_KEY }}&suffix=tar.gz"
          tar -xzf database.tar.gz --strip-components=1 --wildcards '*.mmdb'
          rm database.tar.gz

      - name: Commit and Push to GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add GeoLite2-ASN.mmdb
          git commit -m "Automated MMDB Update" || exit 0
          git push
