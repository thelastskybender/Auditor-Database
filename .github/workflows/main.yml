name: Auto-Update MMDB

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-database:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download GeoLite2 Databases
        run: |
          # Download ASN Database
          wget -O asn.tar.gz "https://download.maxmind.com/app/geoip_download?edition_id=GeoLite2-ASN&license_key=${{ secrets.MAXMIND_KEY }}&suffix=tar.gz"
          tar -xzf asn.tar.gz --strip-components=1 --wildcards '*.mmdb'
          
          # Download Country Database
          wget -O country.tar.gz "https://download.maxmind.com/app/geoip_download?edition_id=GeoLite2-Country&license_key=${{ secrets.MAXMIND_KEY }}&suffix=tar.gz"
          tar -xzf country.tar.gz --strip-components=1 --wildcards '*.mmdb'
          
          rm *.tar.gz

      - name: Commit and Push to GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # ADDED THE COUNTRY FILE HERE:
          git add GeoLite2-ASN.mmdb GeoLite2-Country.mmdb
          
          # Only commit if there are actually changes
          git commit -m "Automated MMDB Update (ASN & Country)" || exit 0
          
          # FIX: Pull the latest changes (your manual edits) before pushing
          git pull --rebase origin main
          
          git push
